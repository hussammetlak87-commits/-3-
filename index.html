<title>أساسيات المناهج</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: indigo masthead with a Bloom pyramid, one question card at a time, a question map, then a results page with per-topic bars. */
:root {
  --bg: #f1f4fb;
  --surface: #ffffff;
  --ink: #16213e;
  --muted: #566282;
  --accent: #3347c9;
  --accent-ink: #ffffff;
  --accent-soft: #e3e7fb;
  --line: #d3d9ee;
  --band: #1b2a6b;
  --band-ink: #ffffff;
  --band-muted: #b9c3f0;
  --good: #137a47;
  --good-soft: #d9f2e4;
  --bad: #bf3329;
  --bad-soft: #fbe2df;
  --gold: #8a5a0b;
  --gold-soft: #fdf0d2;
  --display: "Cairo", "Segoe UI", Tahoma, sans-serif;
  --body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1530;
    --surface: #172049;
    --ink: #e9edff;
    --muted: #a4aed2;
    --accent: #93a2ff;
    --accent-ink: #0e1530;
    --accent-soft: #242e66;
    --line: #2c3868;
    --band: #101a4d;
    --band-ink: #ffffff;
    --band-muted: #aab5ea;
    --good: #62d79d;
    --good-soft: #12392a;
    --bad: #ff8e83;
    --bad-soft: #431e1e;
    --gold: #f0c05c;
    --gold-soft: #3b2f13;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1530;
  --surface: #172049;
  --ink: #e9edff;
  --muted: #a4aed2;
  --accent: #93a2ff;
  --accent-ink: #0e1530;
  --accent-soft: #242e66;
  --line: #2c3868;
  --band: #101a4d;
  --band-ink: #ffffff;
  --band-muted: #aab5ea;
  --good: #62d79d;
  --good-soft: #12392a;
  --bad: #ff8e83;
  --bad-soft: #431e1e;
  --gold: #f0c05c;
  --gold-soft: #3b2f13;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  direction: rtl;
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.8;
  padding-block: 0 48px;
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.inner {
  max-width: 800px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* masthead */
.mast { background: var(--band); color: var(--band-ink); padding-block: 26px 22px; }
.mast .inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; }
.mast .txt { min-width: 0; flex: 1 1 320px; }
.eyebrow { color: var(--band-muted); font-size: 14px; }
h1 { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1.25; margin-block: 2px 4px; text-wrap: balance; }
.sub { color: var(--band-muted); font-size: 16px; }
.pyr { flex: none; display: flex; flex-direction: column-reverse; gap: 3px; align-items: center; width: 190px; }
.pyr span { display: block; height: 20px; border-radius: 4px; font-size: 11px; line-height: 20px; text-align: center; color: #101a4d; font-weight: 600; font-family: var(--body); }
.pyr span:nth-child(1) { width: 190px; background: #f3b98a; }
.pyr span:nth-child(2) { width: 160px; background: #f0dc7c; }
.pyr span:nth-child(3) { width: 130px; background: #b4e17d; }
.pyr span:nth-child(4) { width: 100px; background: #7fdca1; }
.pyr span:nth-child(5) { width: 74px; background: #7fd8cf; }
.pyr span:nth-child(6) { width: 52px; background: #86c3ea; }

.status { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; padding-block: 16px 8px; }
.status .nums { display: flex; gap: 22px; color: var(--muted); font-size: 15px; }
.status b { font-family: var(--display); font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; margin-inline-start: 4px; }
.track { height: 10px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; }
.track > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width 0.3s ease; }

main { display: flex; flex-direction: column; gap: 18px; padding-top: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 26px; display: flex; flex-direction: column; gap: 20px; }
.qmeta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.qnum { font-family: var(--display); font-weight: 700; font-size: 17px; color: var(--accent); font-variant-numeric: tabular-nums; }
.topic { font-size: 13px; color: var(--muted); background: var(--accent-soft); border-radius: 99px; padding: 1px 12px; }
.qtext { font-family: var(--display); font-weight: 800; font-size: 25px; line-height: 1.75; text-wrap: pretty; }

.opts { display: flex; flex-direction: column; gap: 12px; }
.opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: right; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.opt:hover { border-color: var(--accent); background: var(--accent-soft); }
.letter { flex: none; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 18px; background: var(--accent-soft); color: var(--accent); }
.otext { flex: 1; min-width: 0; font-weight: 500; font-size: 19px; line-height: 1.7; }
.mark { flex: none; min-width: 26px; text-align: center; font-weight: 700; font-size: 20px; }
.opt.locked { cursor: default; }
.opt.locked:hover { border-color: var(--line); background: var(--surface); }
.opt.correct, .opt.correct:hover { background: var(--good-soft); border-color: var(--good); }
.opt.correct .letter { background: var(--good); color: var(--surface); }
.opt.correct .mark { color: var(--good); }
.opt.wrong, .opt.wrong:hover { background: var(--bad-soft); border-color: var(--bad); }
.opt.wrong .letter { background: var(--bad); color: var(--surface); }
.opt.wrong .mark { color: var(--bad); }

.hintrow { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.hintbtn { border: 1.5px solid var(--gold); background: var(--gold-soft); color: var(--gold); border-radius: 10px; padding: 6px 18px; font-weight: 600; cursor: pointer; }
.hintbtn[disabled] { opacity: 0.45; cursor: default; }
.hint { background: var(--gold-soft); color: var(--ink); border-radius: 10px; padding: 12px 16px; width: 100%; font-size: 17px; }
.hint b { color: var(--gold); font-family: var(--display); margin-inline-end: 6px; }

.fb { border-radius: 12px; padding: 14px 16px; font-size: 17px; }
.fb strong { display: block; font-family: var(--display); font-size: 20px; margin-bottom: 2px; }
.fb.ok { background: var(--good-soft); }
.fb.ok strong { color: var(--good); }
.fb.no { background: var(--bad-soft); }
.fb.no strong { color: var(--bad); }

.row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.btn { border: 2px solid var(--accent); background: var(--surface); color: var(--accent); border-radius: 12px; padding: 9px 26px; cursor: pointer; font-weight: 600; font-size: 17px; }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.quiet { border-color: var(--line); color: var(--muted); }
.btn[disabled] { opacity: 0.4; cursor: default; }

.map h3 { font-family: var(--display); font-size: 17px; color: var(--muted); font-weight: 700; margin-bottom: 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.cell { height: 38px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; font-variant-numeric: tabular-nums; padding: 0; }
.cell.ok { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.cell.no { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.cell.now { outline: 3px solid var(--accent); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; font-size: 14px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; border: 1.5px solid var(--line); }
.legend .l-ok::before { background: var(--good-soft); border-color: var(--good); }
.legend .l-no::before { background: var(--bad-soft); border-color: var(--bad); }

/* results */
.score { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 24px; }
.ring { position: relative; width: 170px; height: 170px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .bgc { fill: none; stroke: var(--accent-soft); stroke-width: 14; }
.ring .fgc { fill: none; stroke: var(--accent); stroke-width: 14; stroke-linecap: round; }
.ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 40px; direction: ltr; font-variant-numeric: tabular-nums; }
.verdict { text-align: center; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.verdict .big { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.4; }
.verdict .small { color: var(--muted); font-size: 16px; }
.breakdown { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.breakdown div { border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; font-size: 15px; color: var(--muted); }
.breakdown b { display: block; font-family: var(--display); font-size: 28px; color: var(--ink); font-variant-numeric: tabular-nums; }
.topics { display: flex; flex-direction: column; gap: 12px; }
.topics h2, .review h2 { font-family: var(--display); font-size: 21px; font-weight: 800; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; font-size: 16px; }
.trow .bar { grid-column: 1 / -1; height: 10px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
.trow .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.trow .v { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; direction: ltr; }
.review { display: flex; flex-direction: column; gap: 12px; }
.ritem { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; font-size: 17px; }
.ritem .rq { font-family: var(--display); font-weight: 700; font-size: 19px; }
.ritem .mine { color: var(--bad); }
.ritem .right { color: var(--good); font-weight: 600; }
.ritem .why { color: var(--muted); font-size: 15px; }

@media (max-width: 520px) {
  h1 { font-size: 34px; }
  .pyr { width: 150px; }
  .pyr span:nth-child(1) { width: 150px; }
  .pyr span:nth-child(2) { width: 128px; }
  .pyr span:nth-child(3) { width: 104px; }
  .pyr span:nth-child(4) { width: 80px; }
  .pyr span:nth-child(5) { width: 60px; }
  .pyr span:nth-child(6) { width: 42px; }
  .pyr span { font-size: 10px; }
  .card { padding: 18px; }
  .qtext { font-size: 22px; }
  .otext { font-size: 18px; }
  .btn { padding: 9px 20px; }
}
@media (prefers-reduced-motion: reduce) {
  .track > i, .opt { transition: none; }
}
</style>

[1, "هدف يراعي جوانب شخصية المتعلم العقلية والوجدانية والجسمية معًا، يحقق معيار:", "مراعاة طبيعة المتعلم", ["مسايرة روح العصر", "اشتراك المعنيين في تحديدها", "استناد الأهداف إلى فلسفة المجتمع"], "الكلمة المفتاحية هي شمولية جوانب الشخصية وخصائص النمو.", "المعيار الثالث: مراعاة طبيعة المتعلم، بأن تحترم الأهداف تكامل شخصيته وتلائم خصائص نموه."],

[1, "في الهدف السلوكي، العنصر الذي يمثل المادة التعليمية المراد تعلمها هو:", "المحتوى", ["الظرف", "المعيار", "السلوك المطلوب"], "ابحث عن «ماذا» يتعلم الطالب، لا «كيف» ولا «متى».", "المحتوى يمثل المادة التعليمية التي سيتم تعلمها أو جزءًا منها."],

  }

function grade(pct) {
  if (pct >= 90) return "ممتاز";
  if (pct >= 80) return "جيد جدًا";
  if (pct >= 70) return "جيد";
  if (pct >= 60) return "مقبول";
  return "يحتاج إلى مراجعة";
}

        '<div class="verdict"><div class="big">' + grade(pct) + '</div><div class="small">حصلت على ' + s.c + ' من ' + N + ' سؤال</div></div>' +

function render() { if (view === "quiz") renderQuiz(); else renderResult(); }
function toCard() {

function choose(j) {
  if (picks[cur] >= 0) return;

  if (b.dataset.go !== undefined) return go(+b.dataset.go);
  var a = b.dataset.act;
  if (a === "next") go(cur + 1);
  else if (a === "prev") go(cur - 1);
  else if (a === "hint") { hinted[cur] = true; renderQuiz(); }
  else if (a === "finish") finish();
  else if (a === "back") go(cur);
  else if (a === "restart") {
    picks = picks.map(function () { return -1; });
    hinted = hinted.map(function () { return false; });
    cur = 0; confirming = false; view = "quiz"; render(); toCard();
  }
});

document.addEventListener("keydown", function (e) {
  if (view !== "quiz" || e.ctrlKey || e.metaKey || e.altKey) return;
  var idx = "1234".indexOf(e.key);
  if (idx >= 0 && e.key.length === 1) { choose(idx); return; }
  if (e.key === "ArrowLeft") go(cur + 1);
  else if (e.key === "ArrowRight") go(cur - 1);
});

render();
</script>
